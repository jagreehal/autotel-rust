[package]
name = "workshop"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Rust OpenTelemetry Workshop: from println! to one trace across three services"

# Every part is its own binary, so an exercise you are halfway through editing
# never stops another part from compiling. `cargo ex 05` and `cargo sol 05`
# (aliases in ../.cargo/config.toml) pick the right one.

[lib]
name = "bank"
path = "bank/mod.rs"

[dependencies]
anyhow = "1.0.104"
autotel = { path = ".." }
axum = "0.8.9"
futures = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "registry"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "ex01"
path = "01-the-console-log-wall/exercise.rs"

[[bin]]
name = "sol01"
path = "01-the-console-log-wall/solution.rs"

