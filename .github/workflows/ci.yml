name: CI

on:
  push:
  pull_request:
  # Weekly: new RustSec advisories land without any code change here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Every feature on its own, plus none: catches code that only compiles with
      # another feature switched on.
      - run: cargo hack clippy -p autotel --each-feature --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      # `--all-targets` skips rustdoc tests; run them so doc examples keep compiling.
      - run: cargo test -p autotel --doc --all-features
      # Default features, as most users will build it.
      - run: cargo test -p autotel --all-targets
      - run: cargo doc -p autotel --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo workshop-check
      - run: cargo package -p autotel

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the dev toolchain; this overrides it.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p autotel --lib --all-features
      - run: cargo check -p autotel --lib --no-default-features

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Advisories, licences, banned crates and sources: policy in deny.toml.
      - run: cargo deny check

  throughput:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      # Release build; fails if span throughput stops scaling with tasks (a global lock).
      - run: cargo test --release -p autotel --test throughput -- --ignored --nocapture
