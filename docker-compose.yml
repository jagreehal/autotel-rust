# Local backend: `docker compose up -d`, then
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 cargo run --example axum --features axum
# and open http://localhost:16686. Jaeger takes traces, so also set OTEL_METRICS_EXPORTER=none
# and OTEL_LOGS_EXPORTER=none.
# Set JAEGER_OTLP_HTTP_PORT and JAEGER_OTLP_GRPC_PORT if autotel-devtools already holds 4317 and 4318.
services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
      - "5778:5778"
      - "9411:9411"
